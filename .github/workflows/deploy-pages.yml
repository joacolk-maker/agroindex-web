name: Publicar Agroindex

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Sincronizar precios desde Supabase
        run: pnpm sync:supabase

      - name: Calcular estacionalidad
        run: pnpm build:seasonality

      - name: Validar snapshot público
        run: pnpm validate:data

      - name: Revisar código
        run: pnpm lint

      - name: Construir sitio estático
        env:
          NEXT_PUBLIC_BASE_PATH: /campo-claro-odepa
        run: pnpm build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
